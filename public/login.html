<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <span>ChatApp</span>
    </div>

    <form id="login-form" class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to keep the conversation going</p>

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />

      <p id="error-msg" class="error-msg"></p>

      <button type="submit">Log in</button>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
